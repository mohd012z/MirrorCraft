name: Verify MirrorCraft

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mirrorcraft-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Crypto smoke
        run: npm run smoke:crypto

      - name: Integration boundary smoke
        run: npm run smoke:integrations

      - name: Provider adapter smoke
        run: npm run smoke:providers

      - name: Editing plan contracts smoke
        run: npm run smoke:editing-plan

      - name: Runtime classifier smoke
        run: npm run smoke:runtime

      - name: Domain planner smoke
        run: npm run smoke:domain

      - name: Lifecycle smoke
        run: npm run smoke:lifecycle

      - name: Build
        run: npm run build

      - name: Studio Playwright smoke
        run: npm run smoke:studio
