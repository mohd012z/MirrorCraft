name: Build MirrorCraft APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-ui-apk
      - fix/android-webview-runtime

permissions:
  contents: read

concurrency:
  group: mirrorcraft-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Verify Android WebView runtime contract
        run: node scripts/smoke-android-webview-runtime.mjs

      - name: Build offline static Studio
        env:
          MIRRORCRAFT_STATIC_EXPORT: "1"
          MIRRORCRAFT_PAGES_BASE_PATH: "/assets"
        run: |
          set -e
          for attempt in 1 2 3; do
            npm run build && break
            [ "$attempt" = "3" ] && exit 1
            rm -rf .next out
          done

      - name: Stage static assets into Android app
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -R out/. android/app/src/main/assets/
          test -f android/app/src/main/assets/studio/index.html
          test -d android/app/src/main/assets/_next
          grep -q '/assets/_next/' android/app/src/main/assets/studio/index.html
          if grep -q 'https://app.local' android/app/src/main/assets/studio/index.html; then
            echo "Legacy app.local origin leaked into Studio export" >&2
            exit 1
          fi
          find android/app/src/main/assets/_next -type f | head -20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK and emulator image
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk MirrorCraft-debug.apk
          unzip -Z1 MirrorCraft-debug.apk > MirrorCraft-debug.apk.files.txt
          grep -Fxq 'assets/studio/index.html' MirrorCraft-debug.apk.files.txt
          grep -Eq '^assets/_next/static/chunks/.*\.js$' MirrorCraft-debug.apk.files.txt
          grep -Eq '^assets/_next/static/chunks/.*\.css$' MirrorCraft-debug.apk.files.txt
          test "$(grep -Ec '^assets/_next/.*' MirrorCraft-debug.apk.files.txt)" -ge 5
          ls -lh MirrorCraft-debug.apk
          sha256sum MirrorCraft-debug.apk > MirrorCraft-debug.apk.sha256

      - name: Runtime smoke test on Android emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager -perm -u+x 2>/dev/null | sort -V | tail -1)"
          fi

          echo no | "$AVDMANAGER" create avd \
            --force \
            --name mirrorcraft-ci \
            --package "system-images;android-35;google_apis;x86_64"

          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$EMULATOR" \
            -avd mirrorcraft-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > MirrorCraft-emulator.log 2>&1 &

          cleanup() {
            "$ADB" emu kill >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$ADB" wait-for-device
          booted=0
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Android emulator did not finish booting" >&2
            exit 1
          fi

          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" install -r MirrorCraft-debug.apk
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.msa.mirrorcraft
          "$ADB" shell am start -W -n com.msa.mirrorcraft/.MainActivity

          ready=0
          for attempt in $(seq 1 30); do
            if "$ADB" logcat -d -s MirrorCraftRuntime:I '*:S' | grep -Fq 'STUDIO_READY'; then
              ready=1
              break
            fi
            sleep 2
          done

          "$ADB" exec-out screencap -p > MirrorCraft-runtime.png || true
          "$ADB" shell uiautomator dump /sdcard/mirrorcraft-window.xml >/dev/null 2>&1 || true
          "$ADB" pull /sdcard/mirrorcraft-window.xml MirrorCraft-window.xml >/dev/null 2>&1 || true
          "$ADB" logcat -d > MirrorCraft-runtime.log || true

          if [ -f MirrorCraft-window.xml ] && grep -Fq 'Loading studio' MirrorCraft-window.xml; then
            echo "Studio is still stuck on the loading fallback" >&2
            exit 1
          fi
          if [ "$ready" -ne 1 ]; then
            echo "React/CSS Studio readiness handshake was not observed" >&2
            tail -200 MirrorCraft-runtime.log || true
            exit 1
          fi

          echo "Android runtime smoke: STUDIO_READY"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MirrorCraft-Android-runtime-evidence
          path: |
            MirrorCraft-runtime.png
            MirrorCraft-runtime.log
            MirrorCraft-window.xml
            MirrorCraft-emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorCraft-Android-debug
          path: |
            MirrorCraft-debug.apk
            MirrorCraft-debug.apk.sha256
            MirrorCraft-debug.apk.files.txt
          if-no-files-found: error
          retention-days: 14
