plugins {
    id "com.android.application"
}

android {
    namespace "com.msa.mirrorcraft"
    compileSdk 35

    defaultConfig {
        applicationId "com.msa.mirrorcraft"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Android's default asset ignore pattern drops directories whose names begin
    // with an underscore (for example Next.js' required `_next/` directory).
    // Keep the normal metadata exclusions while allowing `_next/` to be packaged.
    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.17.1"
}
