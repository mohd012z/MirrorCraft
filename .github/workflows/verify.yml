name: Verify MirrorCraft

on:
  push:
    branches:
      - main
  pull_request:
    # Gate PRs against main AND against in-flight feature branches (feat/*,
    # feature/*) — without this, a PR whose base is a feature branch only
    # gets Check and never runs the smoke/Playwright verification.
    branches:
      - main
      - "feat/*"
      - "feature/*"

permissions:
  contents: read

concurrency:
  group: mirrorcraft-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Production dependency audit
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Clone example smoke
        run: npm run smoke:example

      - name: Crypto smoke
        run: npm run smoke:crypto

      - name: Integration boundary smoke
        run: npm run smoke:integrations

      - name: Provider adapter smoke
        run: npm run smoke:providers

      - name: Adversarial context smoke
        run: npm run smoke:adversarial

      - name: Editing plan contracts smoke
        run: npm run smoke:editing-plan

      - name: Runtime classifier smoke
        run: npm run smoke:runtime

      - name: Domain planner smoke
        run: npm run smoke:domain

      - name: Lifecycle smoke
        run: npm run smoke:lifecycle

      - name: Build
        # Retry: next/font/google + Turbopack intermittently fails font import-map
        # resolution on Next 16.3 (vercel/next.js#97344); clearing .next between
        # attempts avoids reusing the stale Turbopack font state.
        run: |
          set -e
          for attempt in 1 2 3; do
            npm run build && break
            [ "$attempt" = "3" ] && exit 1
            rm -rf .next
          done

      - name: Studio Playwright smoke
        run: npm run smoke:studio
