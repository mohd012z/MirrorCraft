name: Refresh dependency lock

on:
  push:
    branches:
      - feature/cursor-agent-kernel
    paths:
      - package.json
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write

concurrency:
  group: mirrorcraft-deps-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Validate generated lockfile
        run: npm ci

      - name: Report production audit
        run: npm audit --omit=dev || true

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile [deps-lock]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
